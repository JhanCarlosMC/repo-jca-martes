<!-- Define el tipo de documento como HTML5 -->
<!DOCTYPE html>
<!-- Inicia la estructura del documento HTML y define el idioma como español -->
<html lang="es">
    <!-- Agrupa los metadatos y configuración de la página -->
    <head>
        <!-- Establece la codificación de caracteres UTF-8 -->
        <meta charset="UTF-8">
        <!-- Hace que la página se adapte al ancho del dispositivo -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Define el título que aparece en la pestaña del navegador -->
        <title>Pagina JCA</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <!-- Contiene el contenido visible que verá el usuario -->
    <body>
        <!-- Aquí se pueden agregar elementos como texto, imágenes o botones -->
        <!-- Etiquetas que guardan información -->
        <h1>Titulo Principal</h1>
        <h2>Subtitulo</h2>
        <p>Bienvenido a la página de JCA</p> <!-- Parrafo-->
        <a href="https://www.w3schools.com/html/default.asp">Enlace</a> <!-- Enlace -->
        <img class="content-section" src="https://tocaunavida.org/wp-content/uploads/2024/10/Logo-JC.png" alt="Logo de JCA"> <!-- Imagen -->
        <ul>
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
        </ul>

        <ol>
            <li>element</li>
            <li>element</li>
            <li>element</li>
        </ol>

        <!-- Etiquetas Estructurales -->
        <div>
            <p>Contenido del div</p>
        </div> <!-- Contenedor Generico -->
        <header>
            <p class="content-section">Contenido del encabezado</p>
        </header>
        <nav>
            <p class="content-section">Contenido de la navegación</p>
        </nav>
        <footer>
            <p id="content-footer">Contenido del pie de página</p>
        </footer>
        <main>
            <p id="content-main" class="content-section">Contenido principal</p>
        </main>
        <section>
            <p>Contenido de la sección</p>
        </section>

    </body>
</html>
